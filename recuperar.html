<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin Hub | Recuperar senha</title>
    <meta name="description" content="Recupere o acesso à sua conta Fin Hub.">
    <link rel="stylesheet" href="styles/styles/recuperar.css">
</head>

<body class="recovery-page">
    <main class="recovery-layout">
        <section class="recovery-brand-panel">
            <div class="recovery-brand">
                <span class="recovery-brand-mark"></span>
                <span class="recovery-brand-name"><span>Fin</span> <span>Hub</span></span>
            </div>
            <div class="recovery-hero">
                <h1 class="recovery-hero-title">
                    <span>Recupere o acesso à sua</span>
                    <span>conta com segurança.</span>
                </h1>
                <p class="recovery-hero-description">Informe seu e-mail e nós enviaremos um link para redefinir sua
                    senha.</p>
            </div>
            <div class="recovery-visual">
                <span class="recovery-visual-wave"></span>
                <span class="recovery-visual-glow"></span>
            </div>
            <div class="recovery-message">
                <span class="recovery-message-line"></span>
                <p>Mais controle.</p>
                <p>Mais planejamento.</p>
                <p>Mais conquistas.</p>
            </div>
        </section>
        <section class="recovery-auth-panel">
            <div class="recovery-card">
                <div class="recovery-card-header">
                    <div class="recovery-brand">
                        <span class="recovery-brand-mark"></span>
                        <span class="recovery-brand-name"><span>Fin</span> <span>Hub</span></span>
                    </div>
                    <h2>Recuperar senha</h2>
                    <p>Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
                </div>
                <form class="recovery-form">
                    <div class="form-group">
                        <label class="form-label" for="email">E-mail</label>
                        <span class="form-input-icon"></span>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu e-mail"
                            required>
                    </div>
                    <button type="submit" class="recovery-submit">
                        <span>Enviar link</span>
                        <span class="recovery-submit-icon"></span>
                    </button>
                </form>
                <div class="recovery-divider">
                    <span class="recovery-divider-line"></span>
                    <span class="recovery-divider-text">ou</span>
                    <span class="recovery-divider-line"></span>
                </div>
                <div class="recovery-login">
                    <a href="index.html">
                        <span class="recovery-login-icon"></span>
                        <span>Voltar para o login</span>
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
